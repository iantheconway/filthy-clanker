# Allowlisting forward proxy for the eval sandbox.
# Only destinations matching proxy-allowlist.txt are permitted; everything else
# is denied (FilterDefaultDeny Yes). This is the SOLE public-internet egress path
# in the sandboxed container (see sandbox/entrypoint.sh).

Port 8119
Listen 127.0.0.1
Timeout 600

User clanker-proxy
Group clanker-proxy

PidFile "/run/clanker/tinyproxy.pid"
LogFile "/var/log/clanker/tinyproxy.log"
LogLevel Warning

# Domain allowlist — deny by default, permit only the listed patterns.
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
Filter "/etc/clanker/proxy-allowlist.txt"

# Allow HTTPS (CONNECT) only to the standard TLS port; the Filter still applies
# to the CONNECT host, so this does not widen the allowlist.
ConnectPort 443
