# Cloud-open worker run via Together (OpenAI-compatible endpoint): all worker agents ->
# Qwen3-235B-A22B-Instruct. ToS-clean for training data (Apache-2.0 model). Pair with the
# Haiku summarizer + nyu-ctf prompts:
#     --profile nyu-ctf,cloud-qwen235,cloud-haiku-summ
# Needs TOGETHER_API_KEY in .env. GPU-free (set OLLAMA_HOST to a dead port so the rare
# refusal path — hardcoded to Ollama — fails fast instead of loading a model).
# The deep-merge keeps each agent's tools + system_prompt from agents.yaml; it only swaps
# provider/model/endpoint.
agents:
  supervisor:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  recon:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  exploit:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  privesc:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  webexplorer:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  vulnsearch:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  reversing:
    provider: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY
    model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
