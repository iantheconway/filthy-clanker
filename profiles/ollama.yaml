# profiles/ollama.yaml — fully local overlay (no API calls).
#
# Overlaid on agents.yaml at load time (deep-merged): every agent runs against a
# local Ollama server. Change `model` and `host` to match what you have pulled
# (`ollama list`) and where your server runs. The model below is the same one
# agents.yaml already uses for refusal_specialist, so it should be available.
#
# refusal_specialist is inherited unchanged from agents.yaml (already Ollama).
#
# Local models have much smaller context windows than the hosted Claude models,
# so this profile also lowers the compaction/summarization thresholds so history
# is condensed earlier — otherwise the context overflows the model.
#
# Run with:  python src/main.py --profile ollama   (then pick "per-agent config")
agents:
  supervisor:  {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  recon:       {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  exploit:     {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  privesc:     {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  webexplorer: {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  vulnsearch:  {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
  summarizer:  {provider: ollama, model: huihui_ai/qwen3.5-abliterated:9b, host: "http://10.0.2.2:11434"}
settings:
  # Local 9B models have ~8–32k context — condense sooner than the hosted default.
  context_limit_threshold: 24000
  tool_output_threshold: 2000
